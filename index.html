<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFT HALFROX Leaderboard</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background"></div>
    <div class="overlay"></div>

    <div id="app">

        <header>

            <div class="logo left">
                <img src="assets/hyrox-logo.png" alt="HYROX Logo">
            </div>

            <div class="title">
                <h1>BFT HALFROX LEADERBOARD</h1>

                <div id="liveStatus">
                    <span class="live-dot"></span>
                    <span>LIVE • AUTO REFRESH • TOP 10 FINISHERS</span>
                </div>

            </div>

            <div class="logo right">
                <img src="assets/bft-logo.png" alt="Body Fit Training Logo">
            </div>

        </header>

        <main>

            <section class="leaderboard-card">

                <table id="leaderboard">

                    <thead>
                        <tr>
                            <th>PLACE</th>
                            <th>ATHLETE</th>
                            <th>DIVISION</th>
                            <th>TIME</th>
                        </tr>
                    </thead>

                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="4">Waiting for race results...</td>
                        </tr>
                    </tbody>

                </table>

            </section>

        </main>

        <footer>

            <div class="footer-left">
                Last Updated:
                <span id="lastUpdated">--:--:--</span>
            </div>

            <div class="footer-right">
                Refreshing every 5 seconds
            </div>

        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
